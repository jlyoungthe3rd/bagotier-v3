name: PR Build & Preview Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PR bundle
        run: VITE_BASE=/ npm run build

      - name: Upload PR Preview Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-build-html
          path: ./dist
          retention-days: 7
